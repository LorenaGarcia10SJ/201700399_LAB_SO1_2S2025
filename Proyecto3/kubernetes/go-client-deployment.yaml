apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-client
  template:
    metadata:
      labels:
        app: go-client
    spec:
      containers:
      - name: go-client
        image: hypostatic-curvier-izabella.ngrok-free.dev/go_client:latest
        ports:
        - containerPort: 9000
---
apiVersion: v1
kind: Service
metadata:
  name: go-client-service
spec:
  selector:
    app: go-client
  ports:
  - port: 9000
    targetPort: 9000

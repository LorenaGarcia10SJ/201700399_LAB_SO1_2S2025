apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
      - name: grafana
        image: grafana/grafana:11.2.0
        ports:
        - containerPort: 3000
        volumeMounts:
          - name: grafana-storage
            mountPath: /var/lib/grafana
          - name: grafana-datasources
            mountPath: /etc/grafana/provisioning/datasources
          - name: grafana-dashboards
            mountPath: /etc/grafana/provisioning/dashboards
          - name: grafana-dashboard-files
            mountPath: /var/lib/grafana/dashboards
        env:
          - name: GF_SECURITY_ADMIN_USER
            value: admin
          - name: GF_SECURITY_ADMIN_PASSWORD
            value: admin
          - name: GF_INSTALL_PLUGINS
            value: "redis-datasource"
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
      volumes:
        - name: grafana-storage
          emptyDir: {}
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
        - name: grafana-dashboard-files
          configMap:
            name: grafana-dashboard-files
---
apiVersion: v1
kind: Service
metadata:
  name: grafana-service
spec:
  type: LoadBalancer
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Redis
        type: redis-datasource
        access: proxy
        orgId: 1
        url: redis://valkey-service:6379
        isDefault: true
        jsonData:
          client: standalone
          poolSize: 5
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: "Dashboards"
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-files
data:
  dashboard.json: |
    {
      "id": null,
      "title": "Dashboard 201700399",
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "type": "barchart",
          "title": "Humedad Promedio por Municipio",
          "targets": [
            {
              "query": "FT.AGGREGATE clima \"*\" GROUPBY 1 @municipality REDUCE AVG 1 @humidity AS avg_humidity",
              "type": "redis"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Temperatura Promedio por Municipio",
          "targets": [
            {
              "query": "FT.AGGREGATE clima \"*\" GROUPBY 1 @municipality REDUCE AVG 1 @temperature AS avg_temp",
              "type": "redis"
            }
          ]
        },
        {
          "type": "barchart",
          "title": "Total de Reportes por Condición Climática",
          "targets": [
            {
              "query": "FT.AGGREGATE clima \"*\" GROUPBY 1 @weather REDUCE COUNT 0 AS count",
              "type": "redis"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Serie Temporal: Municipio Chinautla (Carnet 201700399)",
          "targets": [
            {
              "query": "FT.AGGREGATE clima \"@municipality:chinautla\" GROUPBY 1 @timestamp REDUCE AVG 1 @temperature AS avg_temp REDUCE AVG 1 @humidity AS avg_hum",
              "type": "redis"
            }
          ]
        }
      ]
    }

apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer-kafka
  labels:
    app: writer-kafka
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer-kafka
  template:
    metadata:
      labels:
        app: writer-kafka
    spec:
      containers:
      - name: writer-kafka
        image: hypostatic-curvier-izabella.ngrok-free.dev/writer-kafka:v1
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: writer-kafka-service
spec:
  selector:
    app: writer-kafka
  ports:
  - port: 8082
    targetPort: 8082

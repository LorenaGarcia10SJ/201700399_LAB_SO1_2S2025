apiVersion: apps/v1
kind: Deployment
metadata:
  name: writer-rabbitmq
  labels:
    app: writer-rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: writer-rabbitmq
  template:
    metadata:
      labels:
        app: writer-rabbitmq
    spec:
      containers:
      - name: writer-rabbitmq
        image: hypostatic-curvier-izabella.ngrok-free.dev/writer-rabbitmq:v1
        ports:
        - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: writer-rabbitmq-service
spec:
  selector:
    app: writer-rabbitmq
  ports:
  - port: 8081
    targetPort: 8081
